# Publishes the blindfold chess page to GitHub Pages.
name: Deploy blindfold chess to Pages

on:
  push:
    branches: [claude/blindfold-chess-app-9aqtqt, main]
    paths: [blindfold-chess/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: blindfold-chess
      - id: deployment
        uses: actions/deploy-pages@v4
